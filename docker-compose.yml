version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chamcong
      POSTGRES_USER: chamcong
      POSTGRES_PASSWORD: chamcong_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chamcong']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://chamcong:chamcong_dev@db:5432/chamcong
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
    volumes:
      - ./backend/src:/app/src

volumes:
  postgres_data:
